<div class="container">
  <h1>Générez un mot de passe</h1>
  <div class="grid">
    <password-display [message]="message"></password-display>
    <div>
      <password-settings [default-settings]="passwordSettingsCopy" (change-settings)="onSettingsChange($event)"></password-settings>
      <password-controls (generate)="onClickGenerate()" button-text="Générer"></password-controls>
    </div>
  </div>
</div>
